name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup .NET 8 SDK
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Construim proiectul (fara working-directory, deoarece este in radacina)
      - name: Build project
        run: dotnet build

      # Instalam browserele Playwright
      # Verificam daca executabilul este in bin/Debug/net8.0/
      - name: Ensure browsers are installed
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

      # Executam testele
      - name: Run Playwright tests
        run: dotnet test

      # Salvam rezultatele
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: TestResults/
          retention-days: 30
