name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup .NET 8 SDK
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Build the C# Project
      - name: Build project
        run: dotnet build

      # Install Playwright browsers and dependencies for the built project
      # Note: Ensure the path matches your project's output folder
      - name: Ensure browsers are installed
        run: pwsh bin/Debug/net8.0/playwright.ps1 install --with-deps

      # Execute the NUnit tests
      - name: Run Playwright tests
        run: dotnet test

      # Upload test results (optional, but highly recommended)
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: TestResults/
          retention-days: 30
